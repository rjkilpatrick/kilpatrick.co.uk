repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.md$
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: npx prettier --write
        language: system
        files: \.(astro|ts|tsx|js|mjs|jsx|scss|css|json|md|mdx|yml|yaml)$
        exclude: ^package-lock\.json$

      - id: eslint
        name: eslint
        entry: npx eslint --fix
        language: system
        files: \.(astro|ts|tsx|js|mjs|jsx)$

      - id: stylelint
        name: stylelint
        entry: npx stylelint --fix
        language: system
        files: \.(astro|scss|css)$

      - id: astro-check
        name: astro check
        entry: npx astro check
        language: system
        pass_filenames: false
        files: \.(astro|ts|tsx)$
